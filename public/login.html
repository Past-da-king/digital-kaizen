<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Kaizen: Sign in</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="auth"><form class="box" id="f" autocomplete="on">
  <div class="brand"><span class="mark">K</span><span>Digital Kaizen<small>Production monitoring</small></span></div>
  <h1 id="title">Sign in</h1><p id="sub">Use the account an admin made for you.</p>
  <div id="step1">
    <div class="field" id="emailRow"><label for="email">Email</label><input id="email" type="email" autocomplete="username" autofocus></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
  </div>
  <div id="step2" class="hidden">
    <div class="field"><label for="code">6-digit code from your authenticator app</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="000000"></div>
    <p style="font-size:13px;margin:0">Lost your phone? Type one of your recovery codes instead.</p>
  </div>
  <button type="submit" id="go">Continue</button><div class="err" id="err"></div>
</form></div>
<script type="module" src="/login.js"></script>
</body></html>
