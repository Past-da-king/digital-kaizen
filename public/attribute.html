<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Why did the machine stop?</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{display:flex;flex-direction:column;min-height:100dvh}
  .wrap{max-width:520px;margin:0 auto;width:100%;padding:20px 16px 32px}
  .machine{text-align:center;padding:22px 0 6px}
  .machine h1{margin:0;font-size:26px;letter-spacing:-.01em}
  .machine .p{color:var(--dim);font-size:13.5px;margin-top:4px}
  .timer{
    margin:18px 0;padding:22px;border-radius:16px;text-align:center;
    background:rgba(255,77,79,.08);border:1px solid rgba(255,77,79,.28);
  }
  .timer.ok{background:rgba(61,220,132,.07);border-color:rgba(61,220,132,.28)}
  .timer.off{background:rgba(84,96,122,.10);border-color:rgba(84,96,122,.32)}
  .timer .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .timer .t{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1.05;margin-top:6px;color:var(--red)}
  .timer.ok .t{color:var(--green);font-size:34px}
  .timer.off .t{color:var(--grey);font-size:34px}
  .timer .s{font-size:13px;color:var(--dim);margin-top:6px}
  .q{font-size:17px;font-weight:600;margin:26px 0 12px;text-align:center}
  .reasons{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .reason{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px 12px;text-align:center;cursor:pointer;transition:.12s;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    font-size:14px;font-weight:550;color:var(--ink);
  }
  .reason .i{font-size:28px;line-height:1}
  .reason:active{transform:scale(.97)}
  .reason.sel{border-color:var(--accent);background:rgba(77,163,255,.12)}
  textarea{width:100%;margin-top:14px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical;min-height:70px}
  .submit{width:100%;margin-top:16px;padding:17px;font-size:16px;border-radius:13px}
  .submit:disabled{opacity:.35;cursor:not-allowed}
  .done{text-align:center;padding:50px 20px}
  .done .tick{font-size:60px}
  .done h2{margin:14px 0 6px;font-size:22px}
  .done p{color:var(--dim);margin:0;line-height:1.7}
  .hint{color:var(--dim);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.6}
</style>
</head><body>
<div class="wrap" id="app"><p class="hint">Loading…</p></div>
<script type="module" src="/attribute.js"></script>
</body></html>
